name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: ./Languages/JavaScript
        run: npm install

      - name: Run tests
        working-directory: ./Languages/JavaScript
        run: npm test

  test-ts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: ./Languages/TypeScript
        run: npm ci

      - name: Build
        working-directory: ./Languages/TypeScript
        run: npm run build

      - name: Run tests
        working-directory: ./Languages/TypeScript
        run: npm test
